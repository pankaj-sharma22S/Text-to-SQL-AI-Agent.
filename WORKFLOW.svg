<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Text-to-SQL Agent Workflow</title>
  <desc id="desc">Visual workflow from user input through guardrails, chat or SQL routing, database execution, sanitization, and response.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter>
    <style>
      .box{stroke-width:2;rx:14;filter:url(#shadow)} .title{font:700 28px Segoe UI,Arial;fill:#0f172a}.label{font:600 17px Segoe UI,Arial;fill:#0f172a}.small{font:14px Segoe UI,Arial;fill:#475569}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:9 8}.decision{fill:#fef3c7;stroke:#d97706}.security{fill:#fee2e2;stroke:#dc2626}.route{fill:#dbeafe;stroke:#2563eb}.sql{fill:#ede9fe;stroke:#7c3aed}.db{fill:#dcfce7;stroke:#16a34a}.output{fill:#f1f5f9;stroke:#475569}.trace{fill:#fce7f3;stroke:#db2777}
    </style>
  </defs>

  <rect width="1500" height="1040" fill="#f8fafc"/>
  <text x="750" y="45" text-anchor="middle" class="title">Production Text-to-SQL Agent Workflow</text>
  <text x="750" y="72" text-anchor="middle" class="small">Guardrails protect the LLM and database while preserving the existing LangGraph SQL workflow</text>

  <rect x="600" y="100" width="300" height="64" class="box route"/>
  <text x="750" y="128" text-anchor="middle" class="label">User request</text><text x="750" y="150" text-anchor="middle" class="small">FastAPI / SSE gateway</text>
  <path d="M750 164 V205" class="arrow"/>

  <rect x="560" y="205" width="380" height="78" class="box security"/>
  <text x="750" y="236" text-anchor="middle" class="label">Input Guardrails</text><text x="750" y="260" text-anchor="middle" class="small">Injection, PII, credentials, secrets</text>
  <path d="M560 244 H360" class="arrow"/><text x="455" y="230" text-anchor="middle" class="small">blocked</text>
  <rect x="120" y="210" width="240" height="68" class="box security"/><text x="240" y="239" text-anchor="middle" class="label">Safe rejection</text><text x="240" y="260" text-anchor="middle" class="small">Never reaches LLM</text>
  <path d="M750 283 V325" class="arrow"/>

  <rect x="560" y="325" width="380" height="78" class="box decision"/>
  <text x="750" y="356" text-anchor="middle" class="label">Guardrail Router</text><text x="750" y="380" text-anchor="middle" class="small">blocked · clarification · chat · SQL</text>
  <path d="M560 364 H360" class="arrow"/><text x="455" y="350" text-anchor="middle" class="small">ambiguous</text>
  <rect x="120" y="330" width="240" height="68" class="box decision"/><text x="240" y="359" text-anchor="middle" class="label">Clarification</text><text x="240" y="380" text-anchor="middle" class="small">Ask for more context</text>
  <path d="M940 350 H1140" class="arrow"/><text x="1040" y="337" text-anchor="middle" class="small">general chat</text>
  <rect x="1140" y="315" width="250" height="78" class="box route"/><text x="1265" y="347" text-anchor="middle" class="label">chat_node</text><text x="1265" y="371" text-anchor="middle" class="small">No schema or secrets</text>
  <path d="M750 403 V445" class="arrow"/>

  <rect x="560" y="445" width="380" height="70" class="box sql"/>
  <text x="750" y="475" text-anchor="middle" class="label">Existing LangGraph SQL flow</text><text x="750" y="497" text-anchor="middle" class="small">Schema → SQLQuery → execute → answer</text>
  <path d="M750 515 V555" class="arrow"/>

  <rect x="560" y="555" width="380" height="78" class="box sql"/>
  <text x="750" y="586" text-anchor="middle" class="label">SQL Security Gateway</text><text x="750" y="610" text-anchor="middle" class="small">Read-only · one statement · schema validation</text>
  <path d="M560 594 H360" class="arrow"/><text x="455" y="580" text-anchor="middle" class="small">invalid / dangerous</text>
  <rect x="120" y="560" width="240" height="68" class="box security"/><text x="240" y="589" text-anchor="middle" class="label">Safe SQL error</text><text x="240" y="610" text-anchor="middle" class="small">No execution</text>
  <path d="M940 594 H1140" class="arrow"/><text x="1040" y="580" text-anchor="middle" class="small">valid SQL</text>
  <rect x="1140" y="555" width="250" height="78" class="box decision"/><text x="1265" y="587" text-anchor="middle" class="label">Risk analysis</text><text x="1265" y="611" text-anchor="middle" class="small">Approval for expensive queries</text>
  <path d="M1265 633 V685" class="arrow"/>
  <rect x="1140" y="685" width="250" height="70" class="box decision"/><text x="1265" y="716" text-anchor="middle" class="label">Human approval</text><text x="1265" y="738" text-anchor="middle" class="small">Required for high risk</text>
  <path d="M1140 720 H1010 V594 H940" class="arrow dashed"/><text x="1060" y="705" text-anchor="middle" class="small">approved</text>

  <rect x="560" y="685" width="380" height="78" class="box db"/>
  <text x="750" y="716" text-anchor="middle" class="label">MySQL / PostgreSQL</text><text x="750" y="740" text-anchor="middle" class="small">Read-only SQL execution</text>
  <path d="M750 763 V805" class="arrow"/>
  <rect x="560" y="805" width="380" height="70" class="box output"/>
  <text x="750" y="835" text-anchor="middle" class="label">Result sanitization</text><text x="750" y="857" text-anchor="middle" class="small">Answer guardrail → response / SSE</text>

  <rect x="1020" y="865" width="370" height="90" class="box trace"/>
  <text x="1205" y="898" text-anchor="middle" class="label">LangSmith tracing</text><text x="1205" y="922" text-anchor="middle" class="small">Safe tags and metadata only</text><text x="1205" y="942" text-anchor="middle" class="small">passed · blocked · clarification · approval</text>
  <path d="M940 840 H1020 V910" class="arrow dashed"/>

  <text x="750" y="1010" text-anchor="middle" class="small">Secrets never enter prompts, database logs, results, or tracing metadata</text>
</svg>
